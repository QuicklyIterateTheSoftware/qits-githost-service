archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-githost, sbom: .sbom/sbom.json }
  # The event vocabulary consumers compile against (qits-ci, qits-projects), built by the
  # java-service archetype's maven step and published by the postlude — no slot is overridden. Its
  # only dependency is the external qits-eventstream, so it links to no sibling; git-storage is NOT
  # declared, because nothing outside this repository depends on it.
  - { type: maven, name: "eu.wohlben.qits:qits-githost-events", path: githost-events, sbom: githost-events/target/sbom.json }
  # The committed OpenAPI document, published as `@apidocs/qits-githost` on every release by the
  # composed postlude (OpenApiSchemaExportTest keeps it current).
  - { type: docs, name: "@apidocs/qits-githost", path: docs/openapi.yml }
# The provider golden masters: the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-githost-golden-masters` and `@qits/githost-golden-masters`, each published
# only when its content changed, plus the `@contracts/qits-githost` docs bundle.
# THE PACTS (ticket qits-1149): qits-githost's own consumer pacts, keyed by the provider's
# repository name, as qits-maintenance-service declares its — against qits-idp (the quarkus-oidc
# tenant's JWKS read). None against qits-projects: since qits-1215 the git host keeps repository
# names itself, pushed to it, and calls qits-projects for nothing. Each sits flat in `pacts/` as
# `qits-githost-service_<provider>.json`; qits-ci packs only `pacts/*_<provider>.json` into that
# provider's maven jar, eu.wohlben.qits:qits-githost-service-pacts-<provider>, and publishes it only
# when those files changed. Beside them (qits-1163), what qits-eventstream asks qits-events on this
# service's behalf — only the outbox publish, as it consumes no event — in
# `qits-githost-service_qits-eventstream-javalib_qits-events-service.json`, written by
# EventstreamPactTest from the library's kit and packed for qits-events-service.
contracts:
  application: qits-githost
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  pacts:
    qits-events-service: { packages: [maven] }
    qits-idp-service: { packages: [maven] }
userflows: qits-githost
