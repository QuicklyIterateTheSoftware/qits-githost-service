# The git routes the annotations cannot describe: plain Vert.x routes in GitHostRoutes, outside
# quarkus.rest.path. SmallRye merges this file with the annotated JAX-RS surface, so the served
# document names every route a consumer calls, each with its operationId. The git wire protocol
# (info/refs, git-upload-pack, git-receive-pack) is left out: git speaks it, not a REST client.
openapi: 3.1.0
components:
  parameters:
    repoId:
      name: repoId
      in: path
      required: true
      schema:
        type: string
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    repoName:
      name: repoName
      in: path
      required: true
      schema:
        type: string
    rev:
      name: rev
      in: path
      required: true
      description: A branch, a tag or a full commit sha
      schema:
        type: string
    path:
      name: path
      in: path
      required: true
      description: A repository-relative path; it may hold slashes
      schema:
        type: string
  headers:
    Git-Commit-Sha:
      description: The commit the revision resolved to
      schema:
        type: string
  responses:
    Tree:
      description: The directory's entries, in the tree's own order
      headers:
        Git-Commit-Sha:
          $ref: "#/components/headers/Git-Commit-Sha"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GitTree"
    Blob:
      description: The file's bytes
      headers:
        Git-Commit-Sha:
          $ref: "#/components/headers/Git-Commit-Sha"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
  schemas:
    GitRepositoryList:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: string
    CreateGitRepository:
      type: object
      properties:
        defaultBranch:
          type: string
    GitRepository:
      type: object
      properties:
        repoId:
          type: string
        defaultBranch:
          type: string
    GitTree:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GitTreeEntry"
    GitTreeEntry:
      type: object
      description: A gitlink (type commit) alone carries sha and mode
      properties:
        name:
          type: string
        type:
          type: string
          enum: [tree, blob, commit]
        sha:
          type: string
        mode:
          type: string
paths:
  /git:
    get:
      operationId: listGitRepositories
      summary: Every repository this host serves, by storage id, sorted
      responses:
        "200":
          description: The storage ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepositoryList"
  /git/{repoId}:
    parameters:
      - $ref: "#/components/parameters/repoId"
    put:
      operationId: createRepository
      summary: Create the repository, idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitRepository"
      responses:
        "201":
          description: Created by this call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepository"
        "200":
          description: Already there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepository"
        "400":
          description: An invalid id or default branch
    get:
      operationId: describeRepository
      summary: The repository's id and default branch
      responses:
        "200":
          description: The repository exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepository"
        "404":
          description: No such repository
    delete:
      operationId: deleteRepository
      summary: Delete the repository
      responses:
        "204":
          description: Deleted
        "404":
          description: No such repository
  /git/{projectId}/{repoName}/tree/{rev}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/repoName"
      - $ref: "#/components/parameters/rev"
    get:
      operationId: getRootTree
      summary: The root directory's entries at a revision
      responses:
        "200":
          $ref: "#/components/responses/Tree"
        "404":
          description: No such repository or revision
  /git/{projectId}/{repoName}/tree/{rev}/{path}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/repoName"
      - $ref: "#/components/parameters/rev"
      - $ref: "#/components/parameters/path"
    get:
      operationId: getTree
      summary: A directory's entries at a revision
      responses:
        "200":
          $ref: "#/components/responses/Tree"
        "404":
          description: No such repository, revision or directory
  /git/{projectId}/{repoName}/blob/{rev}/{path}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - $ref: "#/components/parameters/repoName"
      - $ref: "#/components/parameters/rev"
      - $ref: "#/components/parameters/path"
    get:
      operationId: getBlob
      summary: A file's raw bytes at a revision
      responses:
        "200":
          $ref: "#/components/responses/Blob"
        "404":
          description: No such repository, revision or file
  /git/{repoId}/tree/{rev}:
    parameters:
      - $ref: "#/components/parameters/repoId"
      - $ref: "#/components/parameters/rev"
    get:
      operationId: getRootTreeById
      summary: getRootTree, addressed by storage id
      responses:
        "200":
          $ref: "#/components/responses/Tree"
        "404":
          description: No such repository or revision
  /git/{repoId}/tree/{rev}/{path}:
    parameters:
      - $ref: "#/components/parameters/repoId"
      - $ref: "#/components/parameters/rev"
      - $ref: "#/components/parameters/path"
    get:
      operationId: getTreeById
      summary: getTree, addressed by storage id
      responses:
        "200":
          $ref: "#/components/responses/Tree"
        "404":
          description: No such repository, revision or directory
  /git/{repoId}/blob/{rev}/{path}:
    parameters:
      - $ref: "#/components/parameters/repoId"
      - $ref: "#/components/parameters/rev"
      - $ref: "#/components/parameters/path"
    get:
      operationId: getBlobById
      summary: getBlob, addressed by storage id
      responses:
        "200":
          $ref: "#/components/responses/Blob"
        "404":
          description: No such repository, revision or file
